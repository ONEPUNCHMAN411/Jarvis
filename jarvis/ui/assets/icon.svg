<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hex fill -->
  <polygon
    points="94,50 72,11.9 28,11.9 6,50 28,88.1 72,88.1"
    fill="url(#core)"/>

  <!-- Outer hexagon -->
  <polygon
    points="94,50 72,11.9 28,11.9 6,50 28,88.1 72,88.1"
    stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.30"/>

  <!-- Inner hexagon (dashed) -->
  <polygon
    points="80,50 63,22.3 37,22.3 20,50 37,77.7 63,77.7"
    stroke="#00E5FF" stroke-width="1" stroke-opacity="0.18"
    stroke-dasharray="5 3.5"/>

  <!-- Horizontal scan line -->
  <line x1="6" y1="50" x2="94" y2="50"
        stroke="#00E5FF" stroke-width="0.6" stroke-opacity="0.12"/>

  <!-- Vertex accent dots -->
  <circle cx="94"  cy="50"   r="2.5" fill="#00E5FF" fill-opacity="0.65"/>
  <circle cx="72"  cy="11.9" r="2.5" fill="#00E5FF" fill-opacity="0.65"/>
  <circle cx="28"  cy="11.9" r="2.5" fill="#00E5FF" fill-opacity="0.65"/>
  <circle cx="6"   cy="50"   r="2.5" fill="#00E5FF" fill-opacity="0.65"/>
  <circle cx="28"  cy="88.1" r="2.5" fill="#00E5FF" fill-opacity="0.65"/>
  <circle cx="72"  cy="88.1" r="2.5" fill="#00E5FF" fill-opacity="0.65"/>

  <!-- J lettermark -->
  <g filter="url(#glow)" stroke="#00E5FF" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top bar -->
    <line x1="32" y1="28" x2="66" y2="28" stroke-width="5.5"/>
    <!-- Stem + hook -->
    <path d="M 57 28 V 64 Q 57 78 43 78 Q 29 78 29 64"
          stroke-width="5.5"/>
  </g>

  <!-- Small diamond detail below J hook -->
  <rect x="47.5" y="83.5" width="5" height="5"
        transform="rotate(45 50 86)"
        fill="#00E5FF" fill-opacity="0.5"/>
</svg>
